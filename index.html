<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temple of Kukulkan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Layout: one centred "stone tablet" column on a jungle-dark ground; one screen per station. Single deliberate dark look. */
:root{
  --jungle:#10261f; --moss:#1c3b31; --stone:#ece5d0; --stone-dark:#cfc5a6;
  --ink:#1f2420; --jade:#2f9e83; --gold:#e3b23c; --red:#c8553d; --muted:#8fa79c;
  --display:'Alfa Slab One', Georgia, serif; --body:'Nunito', system-ui, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--jungle);color:var(--stone);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(circle at 20% 0%, #1f4637 0, transparent 45%), radial-gradient(circle at 90% 100%, #193a2f 0, transparent 40%)}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:.5px;margin:0;text-wrap:balance}
h1{font-size:clamp(1.8rem,7vw,2.6rem);color:var(--gold);line-height:1.1}
h2{font-size:1.45rem;color:var(--ink)}
.tablet{background:var(--stone);color:var(--ink);border-radius:6px;padding:20px;box-shadow:0 6px 0 var(--stone-dark), 0 14px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px}
.eyebrow{font-weight:800;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--jade)}
.tablet .eyebrow{color:#23735f}
p{margin:0}
.place{background:#fff8e2;border:2px dashed var(--gold);border-radius:6px;padding:10px 12px;font-weight:700}
.puzzle{background:#fff;border:2px solid var(--stone-dark);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.puzzle .row{display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
label{font-weight:800}
input[type=text]{font:inherit;font-size:1.25rem;padding:10px 12px;border:3px solid var(--ink);border-radius:6px;width:100%;background:#fff;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
button{font:inherit;font-weight:800;border:0;border-radius:6px;padding:12px 18px;cursor:pointer}
.go{background:var(--jade);color:#fff;box-shadow:0 4px 0 #1f6e5b;flex:1 1 160px}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #1f6e5b}
.hint{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.hint[disabled]{opacity:.4;cursor:not-allowed}
.msg{font-weight:800;min-height:1.5em}
.msg.bad{color:var(--red)}
.msg.ok{color:#23735f}
.hintbox{background:#eaf4ef;border-left:5px solid var(--jade);padding:10px 12px;border-radius:4px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.status{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-weight:700;font-size:.9rem}
.dots{display:flex;gap:6px}
.dot{width:26px;height:26px;border-radius:4px;border:2px solid var(--muted);display:grid;place-items:center;font-size:.8rem;color:var(--muted)}
.dot.done{background:var(--jade);border-color:var(--jade);color:#fff}
.dot.now{border-color:var(--gold);color:var(--gold)}
.code{display:flex;gap:8px}
.code span{width:46px;height:56px;border-radius:6px;background:var(--moss);border:2px solid var(--muted);display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;color:var(--gold)}
.code small{display:block;font-family:var(--body);font-size:.6rem;color:var(--muted);line-height:1}
.lock{display:flex;gap:10px;justify-content:center}
.lock input{width:58px;text-align:center;font-family:var(--display);font-size:1.8rem;padding:8px 0}
.art{display:flex;justify-content:center}
.art svg{width:min(260px,70%);height:auto}
.reset{align-self:center;background:transparent;color:var(--muted);font-weight:700;font-size:.85rem;text-decoration:underline}
.treasure{display:flex;gap:12px;justify-content:center}
.treasure span{width:84px;height:96px;border-radius:8px;background:var(--jungle);border:3px solid var(--gold);display:grid;place-items:center;font-family:var(--display);font-size:2.6rem;color:var(--gold);line-height:1;padding-top:8px}
.treasure small{display:block;font-family:var(--body);font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.note{background:#fff8e2;border-left:5px solid var(--gold);padding:10px 12px;border-radius:4px}
</style>

</head>

const JOKERS = 2;

const H = s => { let h = 5381; for (const ch of s) h = (Math.imul(h, 33) ^ ch.codePointAt(0)) >>> 0; return h; };
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');

// ---------- Zustand (pro iPad) ----------
const KEY = 'kukulkan-teams-v1';
const fresh = () => ({ team:-1, step:-1, jokers:JOKERS, start:null, end:null, wrong:0, wrongHere:0, waitUntil:0, hintShown:-1 });
let S = load() || fresh();
function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T = () => DATA.teams[S.team];

/* Schritte eines Teams: 0 = Verben, 1–4 = Karten an den Orten, 5 = The last secret (Klasse), danach Schloss */
function steps(){
  const t = T();
  const list = [{ kind:'verbs', title:'The secret of the verbs', place:'Here in the app – you are still in your classroom.',
                  task:'Write the past simple of each verb on your paper. Take the letter with the number in brackets. The letters make a secret word. It tells you where to go first!',
                  puzzle:t.verbs, ok:t.wordOk, hint:t.verbHint, next:t.stops[0].place }];
  t.stops.forEach((s, i) => list.push({ kind:'card', title:s.card, place:s.place, task:s.q, ok:s.ok, slot:s.slot, hint:s.hint,
                                        next: i < t.stops.length - 1 ? t.stops[i+1].place : 'Now open the temple lock with your five numbers!' }));
  return list;
}

function pyramid(){
  const rows = [];
  for (let i = 0; i < 9; i++) {
    const w = 240 - i * 22, x = (260 - w) / 2, y = 180 - (i + 1) * 17;
    rows.push(`<rect x="${x}" y="${y}" width="${w}" height="17" fill="${i%2? '#d9cfae':'#e8dfc2'}" stroke="#8a7d57" stroke-width="1.5"/>`);
  }
  return `<svg viewBox="0 0 260 200" role="img" aria-label="Pyramid of Kukulkan">
    <rect x="0" y="180" width="260" height="20" fill="#2f5d4a"/>
    ${rows.join('')}
    <rect x="102" y="10" width="56" height="20" fill="#c9bd96" stroke="#8a7d57" stroke-width="1.5"/>
    <rect x="122" y="16" width="16" height="14" fill="#4a3f26"/>
    <rect x="121" y="30" width="18" height="150" fill="#b8ab82" stroke="#8a7d57" stroke-width="1.2"/>
    <polygon points="112,150 121,160 121,168 112,175" fill="#2f9e83"/>
    <circle cx="116" cy="162" r="2" fill="#10261f"/>
  </svg>`;
}

function statusBar(){
  const n = steps().length;
  const dots = Array.from({length:n}, (_, i) => `<span class="dot ${i < S.step ? 'done' : i === S.step ? 'now' : ''}">${i+1}</span>`).join('')
             + `<span class="dot ${S.step >= n ? 'now' : ''}">✦</span>`;
  return `<div class="status"><span>Team ${esc(T().name)}</span><span class="dots" aria-label="Progress">${dots}</span><span>Jokers: ${S.jokers}</span></div>`;
}
function codeBox(){
  return `<div class="code" aria-label="Temple code">${['A','B','C','D','E'].map(k => `<span>?<small>${k}</small></span>`).join('')}</div>`;
}

/* Sperre gegen Durchprobieren: 1. Fehler frei, dann 20 s, 40 s, 60 s */
function penalty(){
  S.wrong++; S.wrongHere++;
  const wait = S.wrongHere >= 2 ? Math.min(60, (S.wrongHere - 1) * 20) : 0;
  S.waitUntil = wait ? Date.now() + wait * 1000 : 0; save();
  return wait;
}
function lockout(btnId, inputs, msgEl, firstText){
  const tick = () => {
    const left = Math.ceil((S.waitUntil - Date.now()) / 1000);
    const btn = document.getElementById(btnId); if (!btn) return;
    if (left > 0) {
      btn.disabled = true; inputs.forEach(i => i.disabled = true);
      msgEl.className = 'msg bad';
      msgEl.textContent = `Kukulkan is angry – no guessing! Read the card again. You can try again in ${left} seconds.`;
      setTimeout(tick, 500);
    } else {
      btn.disabled = false; inputs.forEach(i => i.disabled = false);
      if (S.waitUntil) { msgEl.textContent = firstText || ''; S.waitUntil = 0; save(); }
    }
  };
  tick();
}
function shake(){ const t = document.getElementById('t'); t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); }

function render(){
  if (S.team < 0 || S.step < 0) return intro();
  const st = steps();
  if (S.step >= st.length) return S.end ? finished() : lock();
  station(st[S.step]);
}

function intro(){
  app.innerHTML = `
    <h1>Escape the Temple of Kukulkan</h1>
    <div class="art">${pyramid()}</div>
    <div class="tablet">
      <div class="eyebrow">The story</div>
      <p>Jenny’s brother found an old map in Chichen Itza. It shows a treasure in our school! But the snake god Kukulkan locked it with a code.</p>
      <p>Every team has got its own way through the school. Don’t follow the other teams – their puzzles are different!</p>
      <p>You need a pen and paper for your notes. You have ${JOKERS} jokers for hints.</p>
      <label for="g">Your team code (from your teacher)</label>
      <input type="text" id="g" autocomplete="off" autocapitalize="characters" maxlength="12" placeholder="e.g. ABC-123">
      <div class="btns"><button class="go" id="startBtn">Start the adventure</button></div>
      <p class="msg bad" id="m"></p>
    </div>`;
  const go = () => {
    const h = H(norm(document.getElementById('g').value));
    const i = DATA.teams.findIndex(t => t.codeH === h);
    if (i < 0) { document.getElementById('m').textContent = 'This code is not right. Check it or ask your teacher.'; return; }
    S = Object.assign(fresh(), { team:i, step:0, start:Date.now() }); save(); render();
  };
  document.getElementById('startBtn').onclick = go;
  document.getElementById('g').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

function station(st){
  const puzzle = st.puzzle ? `<div class="puzzle">${st.puzzle.map((v, i) => `<div class="row">${i+1}&nbsp;&nbsp;${esc(v[0])} → ______&nbsp;&nbsp;(letter ${v[1]})</div>`).join('')}</div>` : '';
  const head = st.kind === 'card' ? `Card: “${esc(st.title)}”` : esc(st.title);
  app.innerHTML = `
    ${statusBar()}
    <div class="tablet" id="t">
      <div class="eyebrow">${head}</div>
      <p class="place">${esc(st.place)}</p>
      ${puzzle}
      <p><strong>${st.kind === 'card' ? 'Your question: ' : ''}</strong>${esc(st.task)}</p>
      <label for="a">Your answer</label>
      <input type="text" id="a" autocomplete="off" inputmode="${st.kind === 'card' ? 'numeric' : 'text'}">
      <div class="btns">
        <button class="go" id="check">Check</button>
        <button class="hint" id="hintBtn" ${S.jokers ? '' : 'disabled'}>Use a joker</button>
      </div>
      <p class="msg" id="m"></p>
      <div id="h">${S.hintShown === S.step ? `<div class="hintbox"><strong>Hint:</strong> ${esc(st.hint)}</div>` : ''}</div>
    </div>
    ${codeBox()}
    <button class="reset" id="reset">Teacher: reset this iPad</button>`;
  const a = document.getElementById('a');
  if (S.waitUntil > Date.now()) lockout('check', [a], document.getElementById('m'), 'Try again – but read carefully!');
  const check = () => {
    if (document.getElementById('check').disabled) return;
    const m = document.getElementById('m');
    if (!st.ok.includes(H(norm(a.value)))) {
      const wait = penalty();
      m.className = 'msg bad'; m.textContent = st.kind === 'card' ? 'Not quite. Read the card again and try once more.' : 'Not quite. Check your letters and try once more.';
      shake();
      if (wait) lockout('check', [a], m, 'Try again – but read carefully!');
      return;
    }
    const given = a.value.trim();
    S.wrongHere = 0; S.waitUntil = 0; S.step++; save();
    let note = '';
    if (st.slot) note = `<p class="note">Your answer (<strong>${esc(given)}</strong>) is number <strong>${st.slot}</strong> of the temple code. Write it down – you will need it at the end!</p>`;
    if (st.kind === 'verbs') note = `<p class="note">Your secret word is <strong>${esc(given.toUpperCase())}</strong>. It shows you where your adventure starts!</p>`;
    app.innerHTML = `
      ${statusBar()}
      <div class="tablet">
        <div class="eyebrow">Correct!</div>
        ${note}
        <p class="place">${esc(st.next)}</p>
        <div class="btns"><button class="go" id="nx">${S.step >= steps().length ? 'Go to the lock' : 'We are there!'}</button></div>
      </div>
      ${codeBox()}`;
    document.getElementById('nx').onclick = render;
  };
  document.getElementById('check').onclick = check;
  a.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  document.getElementById('hintBtn').onclick = () => {
    if (!S.jokers || S.hintShown === S.step) return;
    S.jokers--; S.hintShown = S.step; save();
    document.getElementById('h').innerHTML = `<div class="hintbox"><strong>Hint:</strong> ${esc(st.hint)}</div>`;
    document.getElementById('hintBtn').disabled = true;
    document.querySelector('.status span:last-child').textContent = 'Jokers: ' + S.jokers;
  };
  if (S.hintShown === S.step) document.getElementById('hintBtn').disabled = true;
  resetHandler();
}

function lock(){
  app.innerHTML = `
    ${statusBar()}
    <h1>The temple lock</h1>
    <div class="tablet" id="t">
      <p>Type the five numbers of your temple code in the order A B C D E.</p>
      <div class="lock">${[0,1,2,3,4].map(i => `<input type="text" id="d${i}" maxlength="1" inputmode="numeric" aria-label="Number ${'ABCDE'[i]}">`).join('')}</div>
      <div class="btns"><button class="go" id="open">Open the lock</button></div>
      <p class="msg" id="m"></p>
    </div>
    ${codeBox()}
    <button class="reset" id="reset">Teacher: reset this iPad</button>`;
  const ins = [0,1,2,3,4].map(i => document.getElementById('d'+i));
  if (S.waitUntil > Date.now()) lockout('open', ins, document.getElementById('m'), 'Try again – check your notes!');
  ins.forEach((el, i) => el.addEventListener('input', () => { if (el.value && ins[i+1]) ins[i+1].focus(); }));
  document.getElementById('open').onclick = () => {
    const code = ins.map(x => x.value).join('');
    if (H(norm(code)) === T().lockH) { S.end = Date.now(); S.waitUntil = 0; save(); finished(); }
    else {
      const wait = penalty();
      const m = document.getElementById('m'); m.className = 'msg bad'; m.textContent = 'The lock does not open. Check the order A B C D E.';
      shake();
      if (wait) lockout('open', ins, m, 'Try again – check your notes!');
    }
  };
  resetHandler();
}

function finished(){
  const t = T();
  const sec = Math.round((S.end - S.start) / 1000);
  const time = `${Math.floor(sec/60)} min ${String(sec%60).padStart(2,'0')} s`;
  app.innerHTML = `
    <h1>You did it, ${esc(t.name)}!</h1>
    <div class="art">${pyramid()}</div>
    <div class="tablet">
      <div class="eyebrow">The temple is open</div>
      <p>Kukulkan gives you a part of his secret:</p>
      <div class="treasure"><span>${esc(t.letter)}<small>letter</small></span><span>${t.pos}<small>number</small></span></div>
      <p class="note">Write down your letter and your number. Keep them safe!</p>
      <p>Your time: <strong>${time}</strong> · Jokers used: <strong>${JOKERS - S.jokers}</strong> · Wrong answers: <strong>${S.wrong}</strong></p>
      <p class="place">Show this screen to your teacher.</p>
    </div>
    <button class="reset" id="reset">Teacher: reset this iPad</button>`;
  resetHandler();
}

function resetHandler(){
  const b = document.getElementById('reset'); if (!b) return;
  b.onclick = () => {
    b.outerHTML = `<div class="tablet" id="rs"><label for="rc">Teacher password</label><input type="password" id="rc" autocomplete="off"><div class="btns"><button class="go" id="rsok">Reset</button></div><p class="msg bad" id="rsm"></p></div>`;
    document.getElementById('rsok').onclick = () => {
      if (H(norm(document.getElementById('rc').value)) === DATA.resetH) { S = fresh(); save(); render(); }
      else document.getElementById('rsm').textContent = 'Wrong password.';
    };
  };
}

render();
</script>

</body>
</html>
